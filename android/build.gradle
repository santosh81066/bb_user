buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0' // Ensure compatibility with Gradle
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0'// Ensure compatibility with Kotlin
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

}


tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
